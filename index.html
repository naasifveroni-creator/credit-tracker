<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta Credit Approval</title>
<style>
:root{--bg:#eef1f5;--cd:#fff;--tx:#14213d;--mu:#667085;--bd:#d9dee6;--ac:#c01933;--nv:#0b2a4a;--ok:#16794a;--wn:#a85a00;--hd:#0b2a4a;--ht:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--cd:#18202a;--tx:#e6e9ee;--mu:#93a0b3;--bd:#2a3442;--ac:#ff5a73;--nv:#8fb4e3;--ok:#4cc38a;--wn:#f0a04b;--hd:#0a0f15;--ht:#e6e9ee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{background:var(--hd);color:var(--ht);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:3px solid var(--ac)}
header h1{font-size:16px;margin:0;margin-right:auto;font-weight:650}
header .who{font-size:12px;opacity:.85}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
nav{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--mu);font-weight:600}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{padding:12px 16px 40px;max-width:1280px;margin:auto}
h2{font-size:15px;margin:22px 0 8px}h3{font-size:13px;margin:0 0 6px;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp div{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.kp b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kp span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13px}th{color:var(--mu);font-weight:600;font-size:12px}
tr:last-child td{border:0}.mu{color:var(--mu)}
button.b{background:var(--nv);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
button.s{background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 8px;cursor:pointer}
button.r{border-color:var(--ac);color:var(--ac)}button.g{border-color:var(--ok);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.pill{border-radius:10px;padding:1px 8px;font-size:12px;border:1px solid var(--bd)}
.s-approved{color:var(--ok);border-color:var(--ok)}.s-pending,.s-claimed{color:var(--wn);border-color:var(--wn)}
.s-rejected,.s-expired,.s-cancelled{color:var(--ac);border-color:var(--ac)}.s-deferred{color:var(--mu)}
.fl{padding:8px 12px;border-radius:6px;margin-bottom:10px;border:1px solid}.fl.ok{color:var(--ok);border-color:var(--ok)}.fl.no{color:var(--ac);border-color:var(--ac)}
textarea{width:100%;min-height:80px;font-family:inherit}
.req{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px}
.req.urgent{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 20%,transparent)}
.req.claimed{border-color:var(--wn);opacity:.9}
.req .notes{background:var(--bg);padding:10px;border-radius:6px;margin:8px 0;white-space:pre-wrap;font-size:14px;line-height:1.5}
.req .meta{font-size:12px;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.req .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#auth{max-width:380px;margin:80px auto;padding:24px;background:var(--cd);border:1px solid var(--bd);border-radius:10px}
#auth input{width:100%;margin:6px 0 12px}
</style></head><body>

<div id="auth" hidden>
  <h1 style="margin:0 0 4px;font-size:20px">Delta Credit Approval</h1>
  <p class="mu" style="margin:0 0 16px;font-size:13px">Sign in with your work email.</p>
  <label style="font-size:12px;color:var(--mu)">Email</label>
  <input id="ai" type="email" autocomplete="username">
  <label style="font-size:12px;color:var(--mu)">Password</label>
  <input id="ap" type="password" autocomplete="current-password">
  <button class="b" style="width:100%" onclick="signIn()">Sign in</button>
  <div id="am" style="margin-top:12px;font-size:13px;color:var(--ac)"></div>
</div>

<div id="app" hidden>
  <header>
    <h1>Delta Credit Approval</h1>
    <span class="who" id="who"></span>
    <button class="s" onclick="signOut()" style="color:var(--ht);border-color:#fff4">Sign out</button>
  </header>
  <nav id="nv"></nav>
  <main id="mn"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = supabase.createClient('https://gyrmlllokrfcqzljkwdx.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cm1sbGxva3JmY3F6bGprd2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODcxOTYsImV4cCI6MjEwODA2MzE5Nn0.eUvAsDVN9fiF9Y_tgb632vQ_VWAvsQFeDvU_jHZ8-5Y');
  const $ = s => document.querySelector(s);
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = n => Math.round(n||0).toLocaleString();
  const dt  = s => s ? new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';

  let me = null, tab = null, reqs = [], agentReqs = [], tls = [], oams = [], chime = null, creditTypes = [], drillDown = null;
  let adminSelectedOam = null, adminSelectedTl = null;
  
  const DEFAULT_TAB = { agent:'Request', tl:'Board', oam:'Dashboard', om:'Dashboard', admin:'Config' };
  const TABS = {
    agent: ['Request','My requests'],
    tl: ['Board','My team','History'],
    oam: ['Dashboard'],
    om: ['Dashboard'],
    admin: ['Config','Roster','Hierarchy','Anomalies','Audit']
  };

  window.signIn = async () => {
    $('#am').textContent = 'Signing in...';
    const { error } = await sb.auth.signInWithPassword({
      email: $('#ai').value.trim(), password: $('#ap').value
    });
    if (error) { $('#am').textContent = error.message; return; }
    $('#am').textContent = 'Success! Loading app...';
    boot();
  };
  window.signOut = async () => { await sb.auth.signOut(); location.reload(); };

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('#auth').hidden = false; $('#app').hidden = true; return; }
    
    const { data: prof, error } = await sb.rpc('link_profile');
    if (error) { alert('Sign-in error: ' + error.message); return signOut(); }
    
    me = prof;
    $('#who').textContent = `${me.display_name} · ${me.role.toUpperCase()} · ${me.person_id}`;
    tab = DEFAULT_TAB[me.role];
    $('#auth').hidden = true; $('#app').hidden = false;
    
    const { data: types } = await sb.from('credit_types').select('*').eq('active', true);
    creditTypes = types || [];

    // Fetch TLs and OAMs for OAM, OM, and Admin
    if (me.role === 'oam' || me.role === 'om' || me.role === 'admin') {
      const { data: tlData } = await sb.from('tls').select('*');
      tls = tlData || [];
      
      const { data: oamData } = await sb.from('oams').select('*');
      oams = oamData || [];
    }
    
    buildNav();
    await refresh();
    subscribe();
    
    setInterval(() => {
      if (!document.getElementById('fref')) {
        refresh();
      }
    }, 10000);
  }

  function subscribe() {
    sb.channel('ccr')
      .on('postgres_changes', { event:'*', schema:'public', table:'customer_credit_requests' },
        async payload => {
          
          if (!document.getElementById('fref')) { 
            await refresh(); 
          } else if (me.role === 'agent') {
            const { data } = await sb.from('customer_credit_requests').select('*')
              .eq('agent_id', me.person_id).order('created_at', { ascending:false }).limit(50);
            agentReqs = data || [];
          }

          if (payload.eventType === 'INSERT' && me.role === 'tl') {
            playChime();
          }

          if (payload.eventType === 'UPDATE' && me.role === 'agent' && payload.new.agent_id === me.person_id) {
            playChime();
            if (payload.new.status === 'approved') {
              alert("NOTIFICATION: Your request has been APPROVED.");
            } else if (payload.new.status === 'rejected') {
              alert("NOTIFICATION: Your request was REJECTED.\nReason: " + (payload.new.rejection_reason || 'None provided'));
            }
          }
        })
      .subscribe();
  }

  function playChime() {
    try {
      chime ||= new (window.AudioContext||window.webkitAudioContext)();
      const o = chime.createOscillator(), g = chime.createGain();
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.15, chime.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, chime.currentTime + 0.5);
      o.connect(g).connect(chime.destination);
      o.start(); o.stop(chime.currentTime + 0.5);
    } catch {}
  }

  async function refresh() {
    if (!me) return;
    
    if (me.role === 'tl' || me.role === 'admin' || me.role === 'oam' || me.role === 'om') {
      const { data } = await sb.from('customer_credit_requests').select('*')
        .order('created_at', { ascending:false }).limit(500);
      reqs = data || [];
    }
    
    if (me.role === 'agent') {
      const { data } = await sb.from('customer_credit_requests').select('*')
        .eq('agent_id', me.person_id).order('created_at', { ascending:false }).limit(50);
      agentReqs = data || [];
    }
    
    render();
  }

  function buildNav() {
    $('#nv').innerHTML = TABS[me.role].map(t =>
      `<button class="${t===tab?'on':''}" onclick="setTab('${t}')">${t}</button>`).join('');
  }
  window.setTab = t => { tab = t; render(); buildNav(); };

  function render() {
    $('#nv').innerHTML = TABS[me.role].map(t =>
      `<button class="${t===tab?'on':''}" onclick="setTab('${t}')">${t}</button>`).join('');
    const V = {
      'Request': viewAgentRequest, 'My requests': viewAgentHistory,
      'Board': viewTLBoard, 'My team': viewTLTeam, 'History': viewTLHistory,
      'Dashboard': viewDash,
      'Config': viewConfig, 'Roster': viewRoster, 'Hierarchy': viewHierarchy, 'Anomalies': viewAnoms, 'Audit': viewAudit
    };
    $('#mn').innerHTML = (V[tab] || (()=>'<p>Nothing here.</p>'))();
  }

  function viewAgentRequest() {
    let opts = '';
    if (creditTypes.length > 0) {
      opts = creditTypes.map(t => `<option value="${esc(t.credit_type_id)}">${esc(t.name)}</option>`).join('');
    } else {
      opts = `<option value="VOUCHER">Travel Voucher</option>
              <option value="SKYMILES">SkyMiles</option>
              <option value="SERVICE">Service Credit</option>`;
    }
    
    return `
    <div class="card">
      <h3>New customer credit request</h3>
      <div class="row">
        <label>Customer ref (PNR / booking / case)<input id="fref" placeholder="e.g. PNR-ABC123"></label>
        <label>Type<select id="ftype">${opts}</select></label>
        <label>Amount<input id="famt" type="number" min="1" style="width:110px"></label>
        <label>Currency<select id="fcur"><option>ZAR</option><option>USD</option></select></label>
        <label>Reason<select id="frc">
          <option>ServiceFailure</option><option>Delay</option><option>LostBag</option>
          <option>Misconnect</option><option>Goodwill</option><option>PolicyException</option><option>Other</option>
        </select></label>
      </div>
      <label style="margin-top:10px;display:block">Reason notes (min 50 chars — be specific, this is what the TL judges)
        <textarea id="fnotes" placeholder="Explain what happened, what the customer experienced, and why this credit is justified."></textarea>
      </label>
      <label style="margin-top:8px;display:block">Your recommendation (optional)
        <input id="frec" placeholder="e.g. R500 voucher + apology">
      </label>
      <p><button class="b" onclick="submitReq()">Submit for approval</button>
      <span id="fmsg" style="margin-left:10px"></span></p>
    </div>
    <h2>Awaiting response</h2>
    ${agentReqs.filter(r => ['pending','claimed'].includes(r.status)).map(agentCard).join('') || '<p class="mu">None pending.</p>'}`;
  }

  function agentCard(r) {
    const cls = r.status === 'claimed' ? 'claimed' : 'urgent';
    return `<div class="req ${cls}">
      <div class="meta">
        <span><b>${r.request_id}</b></span>
        <span>${esc(r.customer_reference)}</span>
        <span>${r.currency} ${fmt(r.amount)}</span>
        <span>${esc(r.reason_code)}</span>
      </div>
      <div style="margin-top:6px"><b>${r.status==='claimed'?'TL reviewing':'Waiting for TL'}</b>${r.claimed_by_tl_id?' — '+esc(r.claimed_by_tl_id):''}</div>
    </div>`;
  }

  function viewAgentHistory() {
    return '<h2>My requests</h2>' + agentReqs.map(r => `
      <div class="req">
        <div class="meta"><b>${r.request_id}</b><span>${esc(r.customer_reference)}</span>
        <span>${r.currency} ${fmt(r.amount)}</span><span class="pill s-${r.status}">${r.status}</span>
        <span>${dt(r.created_at)}</span></div>
        ${r.decision_notes ? '<div class="mu" style="font-size:12px;margin-top:4px">TL Notes: '+esc(r.decision_notes)+'</div>' : ''}
        ${r.rejection_reason ? '<div class="mu" style="font-size:12px;margin-top:4px;color:var(--ac)">Reason: '+esc(r.rejection_reason)+'</div>' : ''}
      </div>`).join('') || '<p class="mu">No requests yet.</p>';
  }

  window.submitReq = async () => {
    $('#fmsg').textContent = 'Submitting…';
    const { data, error } = await sb.rpc('submit_credit_request', {
      p_customer_reference: $('#fref').value.trim(),
      p_credit_type_id: $('#ftype').value,
      p_amount: +$('#famt').value,
      p_reason_code: $('#frc').value,
      p_reason_notes: $('#fnotes').value,
      p_agent_recommendation: $('#frec').value.trim() || null,
      p_currency: $('#fcur').value
    });
    if (error || !data.success) {
      $('#fmsg').textContent = (data && data.message) || error.message;
      $('#fmsg').style.color = 'var(--ac)';
    } else {
      $('#fmsg').textContent = 'Submitted: ' + data.request_id;
      $('#fmsg').style.color = 'var(--ok)';
      $('#fref').value = ''; $('#fnotes').value = ''; $('#frec').value = '';
      await refresh();
    }
  };

  function viewTLBoard() {
    const pending = reqs.filter(r => r.status === 'pending');
    const claimedByMe = reqs.filter(r => r.status === 'claimed' && r.claimed_by_tl_id === me.person_id);
    const claimedByOthers = reqs.filter(r => r.status === 'claimed' && r.claimed_by_tl_id !== me.person_id);

    return `
      <h2>Live queue — ${pending.length} waiting</h2>
      ${pending.map(tlCard).join('') || '<p class="mu">No pending requests.</p>'}
      <h2>Claimed by you — ${claimedByMe.length}</h2>
      ${claimedByMe.map(tlCard).join('') || '<p class="mu">Nothing.</p>'}
      <h2>Claimed by others</h2>
      ${claimedByOthers.map(tlCard).join('') || '<p class="mu">Nothing.</p>'}`;
  }

  function viewTLTeam() {
    return '<p class="mu">Team roster — see Admin → Roster.</p>';
  }

  function tlCard(r) {
    const mine = r.status === 'claimed' && r.claimed_by_tl_id === me.person_id;
    const cls = r.status === 'pending' ? 'urgent' : (mine ? '' : 'claimed');
    return `<div class="req ${cls}">
      <div class="meta">
        <span><b>${r.request_id}</b></span>
        <span>Agent: ${esc(r.agent_id)}</span>
        <span>${esc(r.reason_code)}</span>
        <span><b>${r.currency} ${fmt(r.amount)}</b></span>
      </div>
      <div class="notes">${esc(r.reason_notes||'')}</div>
      <div class="meta">
        <span>Customer: ${esc(r.customer_reference||'')}</span>
      </div>
      <div class="acts">
        ${r.status==='pending' ? `<button class="b" onclick="claimReq('${r.request_id}')">Claim</button>` : ''}
        ${mine ? `<button class="b" style="background:var(--ok)" onclick="decideReq('${r.request_id}','approved')">Approve</button>
                  <button class="s r" onclick="decideReq('${r.request_id}','rejected')">Reject</button>` : ''}
      </div>
    </div>`;
  }

  window.claimReq = async (id) => {
    const { data } = await sb.rpc('claim_credit_request', { p_request_id: id });
    if (!data.success) alert(data.message);
    await refresh();
  };
  
  window.decideReq = async (id, decision) => {
    const notes = prompt(decision === 'approved' ? 'Notes (optional)' : 'Reason for rejection (required)');
    if (decision === 'rejected' && !notes) return alert('Rejection reason required.');
    const { data } = await sb.rpc('decide_credit_request', {
      p_request_id: id, p_decision: decision,
      p_notes: notes || null,
      p_rejection_reason: decision === 'rejected' ? notes : null
    });
    if (!data.success) alert(data.message);
    await refresh();
  };

  function viewTLHistory() {
    const done = reqs.filter(r => ['approved','rejected'].includes(r.status));
    return '<h2>Recent decisions</h2>' + (done.map(r => `
      <div class="req">
        <div class="meta">
          <b>${r.request_id}</b>
          <span>${esc(r.agent_id)}</span>
          <span>${r.currency} ${fmt(r.amount)}</span>
          <span class="pill s-${r.status}">${r.status}</span>
        </div>
        <div class="notes">${esc(r.reason_notes||'')}</div>
        ${r.decision_notes ? '<div class="mu" style="font-size:12px;margin-top:4px">TL Notes: '+esc(r.decision_notes)+'</div>' : ''}
        ${r.rejection_reason ? '<div class="mu" style="font-size:12px;margin-top:4px;color:var(--ac)">Reason: '+esc(r.rejection_reason)+'</div>' : ''}
      </div>`).join('') || '<p class="mu">No history yet. Once you approve or reject requests, they will appear here.</p>');
  }

  window.setDrillDown = (level, id) => { drillDown = { level, id }; render(); };
  window.clearDrillDown = () => { drillDown = null; render(); };

  function viewDash() {
    // --- OAM DASHBOARD ---
    if (me.role === 'oam') {
      const myTls = tls.filter(t => t.oam_id === me.oam_id);
      const tlIds = myTls.map(t => t.tl_id);
      const myReqs = reqs.filter(r => tlIds.includes(r.agent_team_tl_id));
      
      const approved = myReqs.filter(r => r.status === 'approved').length;
      const totalDecided = myReqs.filter(r => ['approved', 'rejected'].includes(r.status)).length;
      const liability = myReqs.filter(r => r.status === 'approved').reduce((s,r) => s + +r.amount, 0);
      const issues = myReqs.filter(r => ['rejected', 'expired'].includes(r.status));

      const tlRollup = myTls.map(t => {
        const tlReqs = myReqs.filter(r => r.agent_team_tl_id === t.tl_id);
        const tlApproved = tlReqs.filter(r => r.status === 'approved').length;
        const tlDecided = tlReqs.filter(r => ['approved', 'rejected'].includes(r.status)).length;
        const rate = tlDecided > 0 ? Math.round((tlApproved / tlDecided) * 100) + '%' : '—';
        return `<tr>
          <td>${esc(t.name)} (${esc(t.tl_id)})</td>
          <td>${tlReqs.length}</td>
          <td>${rate}</td>
        </tr>`;
      }).join('');

      return `
        <div class="kp">
          <div><b>${myTls.length}</b><span>TLs in your remit</span></div>
          <div><b>${myReqs.length}</b><span>Total requests</span></div>
          <div><b>${totalDecided > 0 ? Math.round((approved/totalDecided)*100) : 0}%</b><span>Approval rate</span></div>
          <div><b>${fmt(liability)}</b><span>Approved Liability</span></div>
        </div>

        <h2>TL Rollup</h2>
        <div class="tw"><table><thead><tr>
          <th>Team Leader</th><th>Requests</th><th>Approval Rate</th>
        </tr></thead><tbody>
          ${tlRollup || '<tr><td colspan="3" class="mu">No TLs found in your remit.</td></tr>'}
        </tbody></table></div>

        <h2>Issues for follow-up (Rejected / Expired)</h2>
        <div class="tw"><table><thead><tr>
          <th>Request</th><th>Agent</th><th>TL</th><th>Amount</th><th>Status</th><th>Reason</th>
        </tr></thead><tbody>
          ${issues.map(r => `<tr>
            <td>${r.request_id}</td>
            <td>${esc(r.agent_id)}</td>
            <td>${esc(r.agent_team_tl_id)}</td>
            <td>${r.currency} ${fmt(r.amount)}</td>
            <td><span class="pill s-${r.status}">${r.status}</span></td>
            <td>${esc(r.rejection_reason || 'No reason provided')}</td>
          </tr>`).join('') || '<tr><td colspan="6" class="mu">No issues found! Great job.</td></tr>'}
        </tbody></table></div>
      `;
    }

    // --- OM DASHBOARD (DRILL DOWN ENABLED) ---
    
    // 1. If we are drilled down into a specific TL
    if (drillDown && drillDown.level === 'tl') {
      const tlReqs = reqs.filter(r => r.agent_team_tl_id === drillDown.id);
      const tlObj = tls.find(t => t.tl_id === drillDown.id);
      const tlName = tlObj ? tlObj.name : drillDown.id;
      
      return `
        <p><button class="s" onclick="clearDrillDown()">← Back to OAMs</button></p>
        <h2>TL View: ${esc(tlName)}</h2>
        <div class="tw"><table><thead><tr>
          <th>Agent ID</th><th>Total Requests</th><th>Approved</th>
        </tr></thead><tbody>
          ${Object.keys(tlReqs.reduce((acc, r) => { acc[r.agent_id] = true; return acc; }, {})).map(agentId => {
            const aReqs = tlReqs.filter(r => r.agent_id === agentId);
            const app = aReqs.filter(r => r.status === 'approved').length;
            return `<tr>
              <td>${esc(agentId)}</td>
              <td>${aReqs.length}</td>
              <td>${app}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="3" class="mu">No requests for this TL yet.</td></tr>'}
        </tbody></table></div>
      `;
    }

    // 2. If we are drilled down into a specific OAM
    if (drillDown && drillDown.level === 'oam') {
      const oamTls = tls.filter(t => t.oam_id === drillDown.id);
      const oamObj = oams.find(o => o.oam_id === drillDown.id);
      const oamName = oamObj ? oamObj.name : drillDown.id;
      
      return `
        <p><button class="s" onclick="clearDrillDown()">← Back to OAMs</button></p>
        <h2>OAM View: ${esc(oamName)}</h2>
        <div class="tw"><table><thead><tr>
          <th>Team Leader</th><th>Total Requests</th><th>Approved</th><th>Action</th>
        </tr></thead><tbody>
          ${oamTls.map(t => {
            const tReqs = reqs.filter(r => r.agent_team_tl_id === t.tl_id);
            const app = tReqs.filter(r => r.status === 'approved').length;
            return `<tr>
              <td>${esc(t.name)} (${esc(t.tl_id)})</td>
              <td>${tReqs.length}</td>
              <td>${app}</td>
              <td><button class="s" onclick="setDrillDown('tl', '${esc(t.tl_id)}')">View Agents</button></td>
            </tr>`;
          }).join('') || '<tr><td colspan="4" class="mu">No TLs under this OAM.</td></tr>'}
        </tbody></table></div>
      `;
    }

    // 3. The Top-Level OM Dashboard
    const tot = reqs.length;
    const approvedReqs = reqs.filter(r => r.status === 'approved');
    const liability = approvedReqs.reduce((s,r) => s + +r.amount, 0);
    
    // Get all OAMs that report to this specific OM
    const myOams = oams.filter(o => o.om_id === me.person_id);
    
    const oamRows = myOams.map(o => {
      const oamReqs = reqs.filter(r => r.oam_id === o.oam_id);
      const oamApp = oamReqs.filter(r => r.status === 'approved').length;
      const oamLia = oamReqs.filter(r => r.status === 'approved').reduce((s,r) => s + +r.amount, 0);
      
      return `<tr>
        <td><b>${esc(o.name)}</b></td>
        <td>${oamReqs.length}</td>
        <td>${oamApp}</td>
        <td>${fmt(oamLia)}</td>
        <td><button class="s" onclick="setDrillDown('oam', '${esc(o.oam_id)}')">View TLs</button></td>
      </tr>`;
    }).join('');

    const highValue = approvedReqs.sort((a,b) => b.amount - a.amount).slice(0, 10);

    return `
      <div class="kp">
        <div><b>${tot}</b><span>Total Requests</span></div>
        <div><b>${approvedReqs.length}</b><span>Approved</span></div>
        <div><b>${fmt(liability)}</b><span>Campaign Liability</span></div>
      </div>

      <h2>OAM Rollup</h2>
      <div class="tw"><table><thead><tr>
        <th>Operations Assistant Manager</th><th>Total Requests</th><th>Approved</th><th>Total Liability</th><th>Action</th>
      </tr></thead><tbody>
        ${oamRows || '<tr><td colspan="5" class="mu">No data yet.</td></tr>'}
      </tbody></table></div>

      <h2>Top 10 High-Value Approvals</h2>
      <div class="tw"><table><thead><tr>
        <th>Request</th><th>Agent</th><th>Amount</th><th>When</th>
      </tr></thead><tbody>
        ${highValue.map(r => `<tr>
          <td>${r.request_id}</td>
          <td>${esc(r.agent_id)}</td>
          <td><b>${r.currency} ${fmt(r.amount)}</b></td>
          <td>${dt(r.created_at)}</td>
        </tr>`).join('') || '<tr><td colspan="4" class="mu">No approved requests yet.</td></tr>'}
      </tbody></table></div>
    `;
  }

  function viewConfig() { return '<p class="mu">Edit config in Supabase.</p>'; }
  
  function viewRoster() {
    return `
      <h2>Bulk Roster Upload</h2>
      <div class="card">
        <p class="mu" style="margin-top:0">Paste your CSV data below. Format: <code>BMS ID | Name | Email | PPR | Wave | TL ID</code></p>
        <textarea id="ru" placeholder="6332878 | Abrahams, Machandro | m.abrahams@delta.example | 2581441 | 26.21 | 5972127"></textarea>
        <p><button class="b" onclick="uploadRoster()">Upload Roster</button> <span id="rmsg" class="mu" style="margin-left:10px"></span></p>
      </div>`;
  }

  window.uploadRoster = async () => {
    $('#rmsg').textContent = 'Uploading…';
    $('#rmsg').style.color = 'var(--mu)';
    const lines = $('#ru').value.split('\n').map(s => s.trim()).filter(Boolean);
    let success = 0, failed = 0;
    
    for (const line of lines) {
      const parts = line.split('|').map(s => s.trim());
      if (parts.length < 6) { failed++; continue; }
      
      const [id, name, email, ppr, wave, tlid] = parts;
      const isNA = !tlid || tlid.toUpperCase() === 'NA';
      
      let oam_id = null, om_id = null;
      if (!isNA) {
        const { data: tl } = await sb.from('tls').select('oam_id, om_id').eq('tl_id', tlid).maybeSingle();
        if (tl) { oam_id = tl.oam_id; om_id = tl.om_id; }
      }
      
      const { error } = await sb.from('agents').upsert({
        agent_id: id, name: name, email: email, 
        ppr: ppr || null, wave: wave?.replace(/\s+/g,'') || null,
        tl_id: isNA ? null : tlid,
        oam_id: oam_id, om_id: om_id,
        reports_direct_to_oam: isNA, status: 'active'
      });
      
      if (error) { console.error(error); failed++; } else { success++; }
    }
    
    $('#rmsg').textContent = `Done! ${success} loaded, ${failed} failed.`;
    $('#rmsg').style.color = 'var(--ok)';
  };

  // --- HIERARCHY MANAGEMENT ---
  window.selectAdminOam = (id) => { adminSelectedOam = id; adminSelectedTl = null; render(); };
  window.selectAdminTl = (id) => { adminSelectedTl = id; render(); };
  
  window.moveTl = async (tlId, newOamId) => {
    if (!newOamId) return;
    const { data: oam } = await sb.from('oams').select('om_id').eq('oam_id', newOamId).single();
    if (!oam) return alert('Invalid OAM');
    
    await sb.from('tls').update({ oam_id: newOamId, om_id: oam.om_id }).eq('tl_id', tlId);
    // Also update all agents under this TL
    await sb.from('agents').update({ oam_id: newOamId, om_id: oam.om_id }).eq('tl_id', tlId);
    
    // Refresh local data
    const { data: tlData } = await sb.from('tls').select('*');
    tls = tlData || [];
    alert('TL moved successfully!');
    render();
  };

  window.moveAgent = async (agentId, newTlId) => {
    if (!newTlId) return;
    const { data: tl } = await sb.from('tls').select('oam_id, om_id').eq('tl_id', newTlId).single();
    if (!tl) return alert('Invalid TL');
    
    await sb.from('agents').update({ tl_id: newTlId, oam_id: tl.oam_id, om_id: tl.om_id }).eq('agent_id', agentId);
    alert('Agent moved successfully!');
    render();
  };

  function viewHierarchy() {
    if (!adminSelectedOam) {
      const oamOpts = oams.map(o => `<option value="${o.oam_id}">${esc(o.name)} (${esc(o.oam_id)})</option>`).join('');
      return `
        <h2>Manage Hierarchy</h2>
        <div class="card row">
          <label>Select an OAM to view their TLs<select onchange="selectAdminOam(this.value)">
            <option value="">-- Choose OAM --</option>
            ${oamOpts}
          </select></label>
        </div>
      `;
    }

    const currentOam = oams.find(o => o.oam_id === adminSelectedOam);
    const oamTls = tls.filter(t => t.oam_id === adminSelectedOam);
    
    let html = `<p><button class="s" onclick="selectAdminOam(null)">← Back to OAMs</button></p>
    <h2>OAM: ${esc(currentOam.name)}</h2>
    <div class="tw"><table><thead><tr>
      <th>TL Name (ID)</th><th>Move to OAM</th><th>Action</th>
    </tr></thead><tbody>
      ${oamTls.map(t => {
        const oamOpts = oams.map(o => `<option value="${o.oam_id}" ${o.oam_id === t.oam_id ? 'selected' : ''}>${esc(o.name)}</option>`).join('');
        return `<tr>
          <td>${esc(t.name)} (${esc(t.tl_id)})</td>
          <td>
            <select onchange="moveTl('${esc(t.tl_id)}', this.value)">
              ${oamOpts}
            </select>
          </td>
          <td><button class="s" onclick="selectAdminTl('${esc(t.tl_id)}')">View Agents</button></td>
        </tr>`;
      }).join('') || '<tr><td colspan="3" class="mu">No TLs under this OAM.</td></tr>'}
    </tbody></table></div>`;

    if (adminSelectedTl) {
      const tl = tls.find(t => t.tl_id === adminSelectedTl);
      // We need to fetch agents for this TL
      // Since we don't have agents in memory, we'll do a quick fetch
      const agentListDiv = `<div id="agentList"><p class="mu">Loading agents...</p></div>`;
      
      // Quick async fetch and inject
      setTimeout(async () => {
        const { data: agents } = await sb.from('agents').select('*').eq('tl_id', adminSelectedTl);
        const allTls = tls; // Use the already fetched TLs
        
        const agentRows = (agents || []).map(a => {
          const tlOpts = allTls.map(x => `<option value="${x.tl_id}" ${x.tl_id === a.tl_id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
          return `<tr>
            <td>${esc(a.name)} (${esc(a.agent_id)})</td>
            <td>
              <select onchange="moveAgent('${esc(a.agent_id)}', this.value)">
                ${tlOpts}
              </select>
            </td>
          </tr>`;
        }).join('');

        const el = document.getElementById('agentList');
        if (el) {
          el.innerHTML = `
            <h2>Agents under TL: ${esc(tl.name)}</h2>
            <div class="tw"><table><thead><tr>
              <th>Agent Name (ID)</th><th>Move to TL</th>
            </tr></thead><tbody>
              ${agentRows || '<tr><td colspan="2" class="mu">No agents under this TL.</td></tr>'}
            </tbody></table></div>
          `;
        }
      }, 100);

      html += agentListDiv;
    }

    return html;
  }

  function viewAnoms() { return '<p class="mu">Anomaly list coming in v2.</p>'; }
  function viewAudit() { return '<p class="mu">Audit log coming in v2.</p>'; }

  boot();
</script></body></html>
