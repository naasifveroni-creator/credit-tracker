<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta Credit Approval</title>
<style>
:root{--bg:#eef1f5;--cd:#fff;--tx:#14213d;--mu:#667085;--bd:#d9dee6;--ac:#c01933;--nv:#0b2a4a;--ok:#16794a;--wn:#a85a00;--hd:#0b2a4a;--ht:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--cd:#18202a;--tx:#e6e9ee;--mu:#93a0b3;--bd:#2a3442;--ac:#ff5a73;--nv:#8fb4e3;--ok:#4cc38a;--wn:#f0a04b;--hd:#0a0f15;--ht:#e6e9ee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{background:var(--hd);color:var(--ht);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:3px solid var(--ac)}
header h1{font-size:16px;margin:0;margin-right:auto;font-weight:650}
header .who{font-size:12px;opacity:.85}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
nav{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--mu);font-weight:600}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{padding:12px 16px 40px;max-width:1280px;margin:auto}
h2{font-size:15px;margin:22px 0 8px}h3{font-size:13px;margin:0 0 6px;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp div{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.kp b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kp span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13px}th{color:var(--mu);font-weight:600;font-size:12px}
tr:last-child td{border:0}.mu{color:var(--mu)}
button.b{background:var(--nv);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
button.s{background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 8px;cursor:pointer}
button.r{border-color:var(--ac);color:var(--ac)}button.g{border-color:var(--ok);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
.pill{border-radius:10px;padding:1px 8px;font-size:12px;border:1px solid var(--bd)}
.s-approved{color:var(--ok);border-color:var(--ok)}.s-pending,.s-claimed{color:var(--wn);border-color:var(--wn)}
.s-rejected,.s-expired,.s-cancelled{color:var(--ac);border-color:var(--ac)}.s-deferred{color:var(--mu)}
.fl{padding:8px 12px;border-radius:6px;margin-bottom:10px;border:1px solid}.fl.ok{color:var(--ok);border-color:var(--ok)}.fl.no{color:var(--ac);border-color:var(--ac)}
textarea{width:100%;min-height:80px;font-family:inherit}
.req{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px}
.req.urgent{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 20%,transparent)}
.req.claimed{border-color:var(--wn);opacity:.9}
.req .notes{background:var(--bg);padding:10px;border-radius:6px;margin:8px 0;white-space:pre-wrap;font-size:14px;line-height:1.5}
.req .meta{font-size:12px;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.req .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#auth{max-width:380px;margin:80px auto;padding:24px;background:var(--cd);border:1px solid var(--bd);border-radius:10px}
#auth input{width:100%;margin:6px 0 12px}
.check-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
.check-item input { width: 16px; height: 16px; }
</style></head><body>

<div id="auth" hidden>
  <h1 style="margin:0 0 4px;font-size:20px">Delta Credit Approval</h1>
  <p class="mu" style="margin:0 0 16px;font-size:13px">Sign in with your work email.</p>
  <label style="font-size:12px;color:var(--mu)">Email</label>
  <input id="ai" type="email" autocomplete="username">
  <label style="font-size:12px;color:var(--mu)">Password</label>
  <input id="ap" type="password" autocomplete="current-password">
  <button class="b" style="width:100%" onclick="signIn()">Sign in</button>
  <div id="am" style="margin-top:12px;font-size:13px;color:var(--ac)"></div>
</div>

<div id="app" hidden>
  <header>
    <h1>Delta Credit Approval</h1>
    <span class="who" id="who"></span>
    <button class="s" onclick="signOut()" style="color:var(--ht);border-color:#fff4">Sign out</button>
  </header>
  <nav id="nv"></nav>
  <main id="mn"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = supabase.createClient('https://gyrmlllokrfcqzljkwdx.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cm1sbGxva3JmY3F6bGprd2R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODcxOTYsImV4cCI6MjEwODA2MzE5Nn0.eUvAsDVN9fiF9Y_tgb632vQ_VWAvsQFeDvU_jHZ8-5Y');
  const $ = s => document.querySelector(s);
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = n => Math.round(n||0).toLocaleString();
  const dt  = s => s ? new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—';
  const dtd = s => s ? new Date(s).toLocaleDateString() : '—';

  let me = null, tab = null, reqs = [], agentReqs = [], archivedReqs = [], tls = [], oams = [], qaReviews = [], assignments = [], allAgents = [], auditEvents = [], chime = null, creditTypes = [], drillDown = null;
  let adminSelectedOam = null, adminSelectedTl = null;
  let adminData = { config: {}, roster: [], anomalies: [], audit: [] };
  
  // GLOBAL SEARCH MEMORY
  let qaFilterAgent = '';
  let qaFilterTl = '';
  let qaFilterReason = '';
  window.adminAgentSearchText = '';
  window.adminAgentFilterTl = '';
  
  const DEFAULT_TAB = { agent:'Request', tl:'Board', oam:'Dashboard', om:'Dashboard', admin:'Config', qa:'QA Queue', trainer:'Coaching Queue' };
  const TABS = {
    agent: ['Request','My requests','My Coaching','Archive'],
    tl: ['Board','TL Acknowledgements','My team','History','Archive'],
    oam: ['Dashboard', 'Coaching Queue', 'Archive'],
    om: ['Dashboard', 'Archive'],
    admin: ['Config','Roster','Hierarchy','Assignments','Reporting','Data Management','Anomalies','Audit'],
    qa: ['Dashboard', 'QA Queue', 'Archive'],
    trainer: ['Dashboard', 'Agent Scorecards', 'Coaching Queue', 'Archive']
  };

  window.signIn = async () => {
    $('#am').textContent = 'Signing in...';
    const { error } = await sb.auth.signInWithPassword({
      email: $('#ai').value.trim(), password: $('#ap').value
    });
    if (error) { $('#am').textContent = error.message; return; }
    $('#am').textContent = 'Success! Loading app...';
    boot();
  };
  window.signOut = async () => { await sb.auth.signOut(); location.reload(); };

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('#auth').hidden = false; $('#app').hidden = true; return; }
    
    const { data: prof, error } = await sb.rpc('link_profile');
    if (error) { alert('Sign-in error: ' + error.message); return signOut(); }
    
    me = prof;
    $('#who').textContent = `${me.display_name} · ${me.role.toUpperCase()} · ${me.person_id}`;
    tab = DEFAULT_TAB[me.role];
    $('#auth').hidden = true; $('#app').hidden = false;
    
    const { data: types } = await sb.from('credit_types').select('*').eq('active', true);
    creditTypes = types || [];

    if (['oam', 'om', 'admin', 'qa', 'trainer', 'tl'].includes(me.role)) {
      const { data: tlData } = await sb.from('tls').select('*');
      tls = tlData || [];
      const { data: oamData } = await sb.from('oams').select('*');
      oams = oamData || [];
    }

    if (['admin', 'qa', 'trainer'].includes(me.role)) {
      const { data: asgData } = await sb.from('team_assignments').select('*');
      assignments = asgData || [];
    }

    if (me.role === 'admin') {
      const { data: agData } = await sb.from('agents').select('*');
      allAgents = agData || [];
      
      const { data: aeData } = await sb.from('approval_events').select('*').order('occurred_at', {ascending: false});
      auditEvents = aeData || [];
      
      await loadAdminData();
    }
    
    buildNav();
    await refresh();
    subscribe();
  }

  async function loadAdminData() {
    const [cfgRes, anomRes, auditRes] = await Promise.all([
      sb.from('campaign_config').select('*').limit(1),
      sb.from('roster_anomalies').select('*').limit(50),
      sb.from('approval_events').select('*').order('occurred_at', {ascending: false}).limit(50)
    ]);
    adminData.config = cfgRes.data?.[0] || {};
    adminData.anomalies = anomRes.data || [];
    adminData.audit = auditRes.data || [];
  }

  function subscribe() {
    sb.channel('ccr')
      .on('postgres_changes', { event:'*', schema:'public', table:'customer_credit_requests' },
        async payload => {
          if (!document.getElementById('fref') && !document.getElementById('qaInsights') && !document.getElementById('coachNotes')) { 
            await refresh(); 
          } else if (me.role === 'agent') {
            const { data } = await sb.from('customer_credit_requests').select('*')
              .eq('agent_id', me.person_id).order('created_at', { ascending:false }).limit(50);
            agentReqs = data || [];
          }

          if (payload.eventType === 'INSERT' && me.role === 'tl') {
            playChime();
          }

          if (payload.eventType === 'UPDATE' && me.role === 'agent' && payload.new.agent_id === me.person_id) {
            playChime();
            if (payload.new.status === 'approved') {
              alert("NOTIFICATION: Your request has been APPROVED.");
            } else if (payload.new.status === 'rejected') {
              alert("NOTIFICATION: Your request was REJECTED.\nReason: " + (payload.new.rejection_reason || 'None provided'));
            }
          }

          if (payload.eventType === 'UPDATE' && me.role === 'qa' && ['approved','rejected'].includes(payload.new.status) && !['approved','rejected'].includes(payload.old.status)) {
            playChime();
            alert(`NOTIFICATION: Request ${payload.new.request_id} is ready for QA review.`);
          }
        })
      .on('postgres_changes', { event:'*', schema:'public', table:'qa_reviews' },
        async payload => {
          if (!document.getElementById('fref') && !document.getElementById('qaInsights') && !document.getElementById('coachNotes')) { 
            await refresh(); 
          }

          const qa = payload.new;
          const req = reqs.find(r => r.request_id === qa.request_id);
          if (!req) return;

          const reqTl = req.agent_team_tl_id;
          const reqTlObj = tls.find(t => t.tl_id === reqTl);
          const owningOam = reqTlObj ? reqTlObj.oam_id : null;
          const assignedTrainers = assignments.filter(a => a.staff_role === 'trainer' && a.tl_id === reqTl).map(a => a.staff_id);
          const assignedQas = assignments.filter(a => a.staff_role === 'qa' && a.tl_id === reqTl).map(a => a.staff_id);

          const isActor = qa.updated_by && qa.updated_by === me.person_id;

          if (payload.eventType === 'INSERT') {
            if (isActor) return;
            const isTrainerForMe = me.role === 'trainer' && assignedTrainers.includes(me.person_id);
            const isOwningOam = me.role === 'oam' && owningOam === me.oam_id;
            if (isTrainerForMe || isOwningOam) {
              playChime();
              alert(`NOTIFICATION: New QA review submitted for ${qa.request_id}.\nResult: ${(qa.qa_result||'').toUpperCase()}`);
            }
            return;
          }

          if (payload.eventType === 'UPDATE') {
            if (isActor) return;

            const trainerChanged = qa.trainer_status !== payload.old.trainer_status;
            const oamChanged = qa.oam_status !== payload.old.oam_status;
            const tlAckChanged = qa.tl_ack_status !== payload.old.tl_ack_status;
            const agentAckChanged = qa.agent_ack_status !== payload.old.agent_ack_status;

            if (trainerChanged) {
              const isQaSubmitter = me.role === 'qa' && qa.qa_agent_id === me.person_id;
              const isQaForMe = me.role === 'qa' && assignedQas.includes(me.person_id);
              const isOwningOam = me.role === 'oam' && owningOam === me.oam_id;
              if (isQaSubmitter || isQaForMe || isOwningOam) {
                playChime();
                alert(`NOTIFICATION: Trainer updated review for ${qa.request_id}.\nTrainer status: ${(qa.trainer_status||'').toUpperCase()}`);
              }
            }

            if (oamChanged || (qa.oam_status === 'actioned' && payload.old.oam_status !== 'actioned')) {
              const isQaSubmitter = me.role === 'qa' && qa.qa_agent_id === me.person_id;
              const isTrainerForMe = me.role === 'trainer' && assignedTrainers.includes(me.person_id);
              const isAgentTl = me.role === 'tl' && me.person_id === reqTl;
              const isApprovingTl = me.role === 'tl' && me.person_id === req.approved_by_tl_id;
              
              if (isQaSubmitter || isTrainerForMe || isAgentTl || isApprovingTl) {
                playChime();
                alert(`NOTIFICATION: OAM updated review for ${qa.request_id}.\nOAM status: ${(qa.oam_status||'').toUpperCase()}`);
              }
              
              if (qa.qa_result === 'fail' && ['reviewed', 'actioned'].includes(qa.oam_status) && qa.tl_ack_status === 'pending' && me.role === 'tl' && me.person_id === reqTl) {
                playChime();
                alert(`NOTIFICATION: OAM has provided next steps for Request ${qa.request_id}. Please review and acknowledge in your TL Acknowledgements tab.`);
              }
            }

            if (tlAckChanged && qa.tl_ack_status === 'acknowledged') {
              const isQaSubmitter = me.role === 'qa' && qa.qa_agent_id === me.person_id;
              const isTrainerForMe = me.role === 'trainer' && assignedTrainers.includes(me.person_id);
              const isOwningOam = me.role === 'oam' && owningOam === me.oam_id;
              if (isQaSubmitter || isTrainerForMe || isOwningOam) {
                playChime();
                alert(`NOTIFICATION: TL acknowledged coaching for Request ${qa.request_id}.`);
              }
            }

            if (agentAckChanged && qa.agent_ack_status === 'pending') {
              if (me.role === 'agent' && req.agent_id === me.person_id) {
                playChime();
                alert(`NOTIFICATION: Coaching logged for Request ${qa.request_id}. Please acknowledge in your My Coaching tab.`);
              }
            }

            if (agentAckChanged && qa.agent_ack_status === 'acknowledged') {
              const isQaSubmitter = me.role === 'qa' && qa.qa_agent_id === me.person_id;
              const isTrainerForMe = me.role === 'trainer' && assignedTrainers.includes(me.person_id);
              const isOwningOam = me.role === 'oam' && owningOam === me.oam_id;
              const isAgentTl = me.role === 'tl' && me.person_id === reqTl;
              if (isQaSubmitter || isTrainerForMe || isOwningOam || isAgentTl) {
                playChime();
                alert(`NOTIFICATION: Agent acknowledged coaching for Request ${qa.request_id}.`);
              }
            }
          }
        })
      .subscribe();
  }

  function playChime() {
    try {
      chime ||= new (window.AudioContext||window.webkitAudioContext)();
      const o = chime.createOscillator(), g = chime.createGain();
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.15, chime.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, chime.currentTime + 0.5);
      o.connect(g).connect(chime.destination);
      o.start(); o.stop(chime.currentTime + 0.5);
    } catch {}
  }

  async function refresh() {
    if (!me) return;
    
    if (['tl', 'admin', 'oam', 'om', 'qa', 'trainer'].includes(me.role)) {
      const { data } = await sb.from('customer_credit_requests').select('*')
        .order('created_at', { ascending:false }).limit(500);
      reqs = data || [];
      
      const { data: qaData } = await sb.from('qa_reviews').select('*').order('created_at', {ascending: false});
      qaReviews = qaData || [];

      const { data: arcData } = await sb.from('archive_requests').select('*').order('created_at', {ascending: false});
      archivedReqs = arcData || [];
    }
    
    if (me.role === 'agent') {
      const { data } = await sb.from('customer_credit_requests').select('*')
        .eq('agent_id', me.person_id).order('created_at', { ascending:false }).limit(50);
      agentReqs = data || [];

      const { data: qaData } = await sb.from('qa_reviews').select('*').eq('agent_ack_status', 'pending');
      qaReviews = qaData || [];

      const { data: arcAgentData } = await sb.from('archive_requests').select('*')
        .eq('agent_id', me.person_id).order('created_at', {ascending: false});
      archivedReqs = arcAgentData || [];
    }
    
    render();
  }

  function buildNav() {
    $('#nv').innerHTML = TABS[me.role].map(t =>
      `<button class="${t===tab?'on':''}" onclick="setTab('${t}')">${t}</button>`).join('');
  }
  window.setTab = t => { tab = t; render(); buildNav(); };

  function render() {
    $('#nv').innerHTML = TABS[me.role].map(t =>
      `<button class="${t===tab?'on':''}" onclick="setTab('${t}')">${t}</button>`).join('');
    const V = {
      'Request': viewAgentRequest, 'My requests': viewAgentHistory, 'My Coaching': viewAgentCoaching,
      'Board': viewTLBoard, 'TL Acknowledgements': viewTLAcknowledgements, 'My team': viewTLTeam, 'History': viewTLHistory,
      'Dashboard': viewDash,
      'Config': viewConfig, 'Roster': viewRoster, 'Hierarchy': viewHierarchy, 'Assignments': viewAssignments, 'Reporting': viewReporting, 'Data Management': viewDataManagement, 'Anomalies': viewAnoms, 'Audit': viewAudit,
      'QA Queue': viewQAQueue,
      'Coaching Queue': viewCoachingQueue,
      'Agent Scorecards': viewAgentScorecards,
      'Archive': viewArchive
    };
    $('#mn').innerHTML = (V[tab] || (()=>'<p>Nothing here.</p>'))();
  }

  // ============ ARCHIVE VIEW ============
  window.exportArchiveToCSV = () => {
    const myArchive = me.role === 'agent' 
      ? archivedReqs.filter(r => r.agent_id === me.person_id)
      : archivedReqs;

    if (myArchive.length === 0) return alert('No archive data to export.');

    const headers = ['Request ID', 'Agent ID', 'TL ID', 'Amount', 'Currency', 'Reason', 'Status', 'Actioned By', 'Date'];
    const rows = myArchive.map(r => [r.request_id, r.agent_id, r.agent_team_tl_id, r.amount, r.currency, r.reason_code, r.status, r.approved_by_tl_id || '', r.created_at]);
    
    const csvContent = "data:text/csv;charset=utf-8," 
      + [headers, ...rows].map(e => e.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
      
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `archive_export_${me.role}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  function viewArchive() {
    const myArchive = me.role === 'agent' 
      ? archivedReqs.filter(r => r.agent_id === me.person_id)
      : archivedReqs;

    return `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Archived Data</h2>
        <button class="b" onclick="exportArchiveToCSV()">⬇ Export Archive to CSV</button>
      </div>
      <p class="mu">Historical completed requests removed from the live queue to keep the system lean.</p>
      
      <div class="tw"><table><thead><tr>
        <th>Request ID</th><th>Agent</th><th>Amount</th><th>Status</th><th>Actioned By</th><th>Date</th>
      </tr></thead><tbody>
        ${myArchive.map(r => `<tr>
          <td>${r.request_id}</td>
          <td>${esc(r.agent_id)}</td>
          <td>${r.currency} ${fmt(r.amount)}</td>
          <td><span class="pill s-${r.status}">${r.status}</span></td>
          <td>${esc(r.approved_by_tl_id || '—')}</td>
          <td>${dtd(r.created_at)}</td>
        </tr>`).join('') || '<tr><td colspan="6" class="mu">No archived records found.</td></tr>'}
      </tbody></table></div>
    `;
  }

  // ============ AGENT & TL VIEWS ============
  function viewAgentRequest() {
    let opts = '';
    if (creditTypes.length > 0) {
      opts = creditTypes.map(t => `<option value="${esc(t.credit_type_id)}">${esc(t.name)}</option>`).join('');
    } else {
      opts = `<option value="VOUCHER">Travel Voucher</option>
              <option value="SKYMILES">SkyMiles</option>
              <option value="SERVICE">Service Credit</option>`;
    }
    
    return `
    <div class="card">
      <h3>New customer credit request</h3>
      <div class="row">
        <label>Customer ref (PNR / booking / case)<input id="fref" placeholder="e.g. PNR-ABC123"></label>
        <label>Type<select id="ftype">${opts}</select></label>
        <label>Amount<input id="famt" type="number" min="1" style="width:110px"></label>
        <label>Currency<select id="fcur"><option>USD</option></select></label>
        <label>Reason<select id="frc">
          <option>ServiceFailure</option><option>Delay</option><option>LostBag</option>
          <option>Misconnect</option><option>Goodwill</option><option>PolicyException</option><option>Waiver</option><option>Other</option>
        </select></label>
      </div>
      <label style="margin-top:10px;display:block">Reason notes (min 50 chars — be specific, this is what the TL judges)
        <textarea id="fnotes" placeholder="Explain what happened, what the customer experienced, and why this credit is justified."></textarea>
      </label>
      <label style="margin-top:8px;display:block">Your recommendation (optional)
        <input id="frec" placeholder="e.g. R500 voucher + apology">
      </label>
      <p><button class="b" onclick="submitReq()">Submit for approval</button>
      <span id="fmsg" style="margin-left:10px"></span></p>
    </div>
    <h2>Awaiting response</h2>

  window.submitReq = async () => {
    $('#fmsg').textContent = 'Submitting…';

      p_customer_reference: $('#fref').value.trim(),
      p_credit_type_id: $('#ftype').value,
      p_amount: +$('#famt').value,

      p_reason_notes: $('#fnotes').value,
      p_agent_recommendation: $('#frec').value.trim() || null,
      p_currency: $('#fcur').value
    });
    if (error || !data.success) {
      $('#fmsg').textContent = (data && data.message) || error.message;
      $('#fmsg').style.color = 'var(--ac)';

  function viewTLAcknowledgements() {
    const pendingAcks = qaReviews.filter(q => {
      if (q.qa_result !== 'fail') return false;
      if (q.tl_ack_status !== 'pending') return false;
      if (!['reviewed', 'actioned'].includes(q.oam_status)) return false;
      
      const req = reqs.find(r => r.request_id === q.request_id);

    return `

        <div style="margin-bottom:10px; padding:10px; background:var(--bg); border-radius:6px;">
          <strong>QA Insight:</strong> <span style="color:var(--ac)">${esc(q.qa_insights)}</span>
          ${q.trainer_notes ? `<br><br><strong>Trainer Notes:</strong> ${esc(q.trainer_notes)}` : ''}

    return `<div class="req ${cls}">
      <div class="meta">
        <span><b>${r.request_id}</b></span>

        ${mine ? `<button class="b" style="background:var(--ok)" onclick="decideReq('${r.request_id}','approved')">Approve</button>
                  <button class="s r" onclick="decideReq('${r.request_id}','rejected')">Reject</button>` : ''}

    const { data } = await sb.rpc('claim_credit_request', { p_request_id: id });
    if (!data.success) alert(data.message);
    await refresh();
  };
  
  window.decideReq = async (id, decision) => {
    const notes = prompt(decision === 'approved' ? 'Notes (optional)' : 'Reason for rejection (required)');
    if (decision === 'rejected' && !notes) return alert('Rejection reason required.');
    const { data } = await sb.rpc('decide_credit_request', {
      p_request_id: id, p_decision: decision,
      p_notes: notes || null,
      p_rejection_reason: decision === 'rejected' ? notes : null
    });
    if (!data.success) alert(data.message);
    await refresh();
  };

  function viewTLHistory() {
    const done = reqs.filter(r => ['approved','rejected'].includes(r.status));
    return '<h2>Recent decisions</h2>' + (done.map(r => `
      <div class="req">
        <div class="meta">
          <b>${r.request_id}</b>
          <span>Agent: ${esc(r.agent_id)}</span>
          <span>${r.currency} ${fmt(r.amount)}</span>
          <span class="pill s-${r.status}">${r.status}</span>

  // ============ DASHBOARDS ============
  window.setDrillDown = (level, id) => { drillDown = { level, id }; render(); };
  window.clearDrillDown = () => { drillDown = null; render(); };

  function viewDash() {
    if (me.role === 'oam' || me.role === 'qa' || me.role === 'trainer') {
      if (me.role === 'oam' && drillDown && drillDown.level === 'tl') {
        const tlObj = tls.find(t => t.tl_id === drillDown.id);
        if (!tlObj || tlObj.oam_id !== me.oam_id) {
          return `
            <p><button class="s" onclick="clearDrillDown()">← Back to My Dashboard</button></p>
            <div class="card"><b style="color:var(--ac)">Not authorized.</b> This team is not under your supervision.</div>
          `;
        }

        const tlReqs = reqs.filter(r => r.agent_team_tl_id === drillDown.id);
        const statsByAgent = {};
        tlReqs.forEach(r => {
          if (!statsByAgent[r.agent_id]) statsByAgent[r.agent_id] = { total: 0, approved: 0, rejected: 0 };
          statsByAgent[r.agent_id].total++;
          if (r.status === 'approved') statsByAgent[r.agent_id].approved++;
          if (r.status === 'rejected') statsByAgent[r.agent_id].rejected++;
        });

        setTimeout(async () => {
          const el = document.getElementById('oamAgentList');
          if (!el) return;
          const { data: roster } = await sb.from('agents').select('*').eq('tl_id', drillDown.id);
          const agents = roster || [];

          if (agents.length === 0) {
            el.innerHTML = '<p class="mu">No agents are assigned to this TL.</p>';
            return;
          }

          const rows = agents.map(a => {
            const s = statsByAgent[a.agent_id] || { total: 0, approved: 0, rejected: 0 };
            const rate = (s.approved + s.rejected) > 0 ? Math.round((s.approved / (s.approved + s.rejected)) * 100) + '%' : '—';
            const agentReqDates = tlReqs.filter(r => r.agent_id === a.agent_id).map(r => r.created_at).filter(Boolean);
            const lastActivity = agentReqDates.length ? dtd(new Date(Math.max(...agentReqDates.map(d => +new Date(d)))).toISOString()) : '—';
            return `<tr>
              <td>${esc(a.name)}</td>
              <td>${esc(a.agent_id)}</td>
              <td>${s.total}</td>
              <td><span style="color:var(--ok)">${s.approved}</span></td>
              <td><span style="color:var(--ac)">${s.rejected}</span></td>
              <td>${rate}</td>
              <td>${lastActivity}</td>
              <td><button class="s" onclick="openAgentQAHistory('${esc(a.agent_id)}')">QA Scorecard</button></td>
            </tr>`;
          }).join('');

          el.innerHTML = `
            <div class="tw"><table><thead><tr>
              <th>Agent Name</th><th>Agent ID</th><th>Total Requests</th><th>Approved</th><th>Rejected</th><th>Approval Rate</th><th>Last Activity</th><th>QA</th>
            </tr></thead><tbody>
              ${rows}
            </tbody></table></div>
          `;
        }, 0);

        return `
          <p><button class="s" onclick="clearDrillDown()">← Back to My Dashboard</button></p>
          <h2>Team: ${esc(tlObj.name)} (${esc(tlObj.tl_id)})</h2>
          <p class="mu">All agents reporting to this Team Leader — regardless of whether they have live requests.</p>
          <div id="oamAgentList"><p class="mu">Loading agents…</p></div>
          <div id="oamQaHistoryModal"></div>
        `;
      }

      let myTls = [];
      
      if (me.role === 'qa' || me.role === 'trainer') {
        const myAssignedTlIds = assignments.filter(a => a.staff_id === me.person_id).map(a => a.tl_id);
        myTls = tls.filter(t => myAssignedTlIds.includes(t.tl_id));
      } else {
        myTls = tls.filter(t => t.oam_id === me.oam_id);
      }
      
      const tlIds = myTls.map(t => t.tl_id);
      const myReqs = reqs.filter(r => tlIds.includes(r.agent_team_tl_id));
      
      const approved = myReqs.filter(r => r.status === 'approved').length;
      const totalDecided = myReqs.filter(r => ['approved', 'rejected'].includes(r.status)).length;
      const liability = myReqs.filter(r => r.status === 'approved').reduce((s,r) => s + +r.amount, 0);
      const issues = myReqs.filter(r => ['rejected', 'expired'].includes(r.status));

      const crossTlReqs = myReqs.filter(r => r.status === 'approved' && r.approved_by_tl_id && r.approved_by_tl_id !== r.agent_team_tl_id);

      const tlRollup = myTls.map(t => {
        const tlReqs = myReqs.filter(r => r.agent_team_tl_id === t.tl_id);
        const tlApproved = tlReqs.filter(r => r.status === 'approved').length;
        const tlDecided = tlReqs.filter(r => ['approved', 'rejected'].includes(r.status)).length;
        const rate = tlDecided > 0 ? Math.round((tlApproved / tlDecided) * 100) + '%' : '—';
        const actionCell = me.role === 'oam'
          ? `<td><button class="s" onclick="setDrillDown('tl', '${esc(t.tl_id)}')">View Agents</button></td>`
          : '';
        return `<tr>
          <td>${esc(t.name)} (${esc(t.tl_id)})</td>
          <td>${tlReqs.length}</td>
          <td>${rate}</td>
          ${actionCell}
        </tr>`;
      }).join('');

      return `
        <div class="kp">
          <div><b>${myTls.length}</b><span>TLs in view</span></div>
          <div><b>${myReqs.length}</b><span>Total requests</span></div>
          <div><b>${totalDecided > 0 ? Math.round((approved/totalDecided)*100) : 0}%</b><span>Approval rate</span></div>
          <div><b>${fmt(liability)}</b><span>Approved Liability</span></div>
        </div>

        <h2>TL Rollup</h2>
        <div class="tw"><table><thead><tr>
          <th>Team Leader</th><th>Requests</th><th>Approval Rate</th>${me.role === 'oam' ? '<th>Action</th>' : ''}
        </tr></thead><tbody>
          ${tlRollup || `<tr><td colspan="${me.role === 'oam' ? 4 : 3}" class="mu">No TLs found.</td></tr>`}
        </tbody></table></div>

        <h2>Cross-TL Approvals (Coverage)</h2>
        <div class="tw"><table><thead><tr>
          <th>Request</th><th>Agent</th><th>Agent's TL</th><th>Actioned By</th><th>Amount</th>
        </tr></thead><tbody>
          ${crossTlReqs.map(r => `<tr>
            <td>${r.request_id}</td>
            <td>${esc(r.agent_id)}</td>
            <td>${esc(r.agent_team_tl_id)}</td>
            <td><b style="color:var(--ok)">${esc(r.approved_by_tl_id)}</b></td>
            <td>${r.currency} ${fmt(r.amount)}</td>
          </tr>`).join('') || '<tr><td colspan="5" class="mu">No cross-TL approvals yet.</td></tr>'}
        </tbody></table></div>
      `;
    }

    if (drillDown && drillDown.level === 'tl') {
      const tlReqs = reqs.filter(r => r.agent_team_tl_id === drillDown.id);
      const tlObj = tls.find(t => t.tl_id === drillDown.id);
      const tlName = tlObj ? tlObj.name : drillDown.id;
      
      return `
        <p><button class="s" onclick="clearDrillDown()">← Back to OAMs</button></p>

        <div class="tw"><table><thead><tr>
          <th>Agent ID</th><th>Total Requests</th><th>Approved</th>
        </tr></thead><tbody>
          ${Object.keys(tlReqs.reduce((acc, r) => { acc[r.agent_id] = true; return acc; }, {})).map(agentId => {
            const aReqs = tlReqs.filter(r => r.agent_id === agentId);

              <td>${esc(agentId)}</td>
              <td>${aReqs.length}</td>

        </tbody></table></div>
      `;
    }

    if (drillDown && drillDown.level === 'oam') {
      const oamTls = tls.filter(t => t.oam_id === drillDown.id);
      const oamObj = oams.find(o => o.oam_id === drillDown.id);
      const oamName = oamObj ? oamObj.name : drillDown.id;
      
      return `
        <p><button class="s" onclick="clearDrillDown()">← Back to OAMs</button></p>
        <h2>OAM View: ${esc(oamName)}</h2>
        <div class="tw"><table><thead><tr>
          <th>Team Leader</th><th>Total Requests</th><th>Approved</th><th>Action</th>
        </tr></thead><tbody>
          ${oamTls.map(t => {
            const tReqs = reqs.filter(r => r.agent_team_tl_id === t.tl_id);
            const app = tReqs.filter(r => r.status === 'approved').length;
            return `<tr>
              <td>${esc(t.name)} (${esc(t.tl_id)})</td>
              <td>${tReqs.length}</td>
              <td>${app}</td>
              <td><button class="s" onclick="setDrillDown('tl', '${esc(t.tl_id)}')">View Agents</button></td>
            </tr>`;
          }).join('') || '<tr><td colspan="4" class="mu">No TLs under this OAM.</td></tr>'}
        </tbody></table></div>
      `;
    }

    const tot = reqs.length;
    const approvedReqs = reqs.filter(r => r.status === 'approved');
    const liability = approvedReqs.reduce((s,r) => s + +r.amount, 0);
    const myOams = oams.filter(o => o.om_id === me.person_id);
    
    const oamRows = myOams.map(o => {
      const oamReqs = reqs.filter(r => r.oam_id === o.oam_id);
      const oamApp = oamReqs.filter(r => r.status === 'approved').length;
      const oamLia = oamReqs.filter(r => r.status === 'approved').reduce((s,r) => s + +r.amount, 0);
      return `<tr>
        <td><b>${esc(o.name)}</b></td>
        <td>${oamReqs.length}</td>
        <td>${oamApp}</td>
        <td>${fmt(oamLia)}</td>
        <td><button class="s" onclick="setDrillDown('oam', '${esc(o.oam_id)}')">View TLs</button></td>
      </tr>`;
    }).join('');

    const highValue = approvedReqs.sort((a,b) => b.amount - a.amount).slice(0, 10);
    const systemCrossTlReqs = approvedReqs.filter(r => r.approved_by_tl_id && r.approved_by_tl_id !== r.agent_team_tl_id);

    return `
      <div class="kp">
        <div><b>${tot}</b><span>Total Requests</span></div>
        <div><b>${approvedReqs.length}</b><span>Approved</span></div>
        <div><b>${fmt(liability)}</b><span>Campaign Liability</span></div>
      </div>

      <h2>OAM Rollup</h2>
      <div class="tw"><table><thead><tr>
        <th>Operations Assistant Manager</th><th>Total Requests</th><th>Approved</th><th>Total Liability</th><th>Action</th>
      </tr></thead><tbody>
        ${oamRows || '<tr><td colspan="5" class="mu">No data yet.</td></tr>'}
      </tbody></table></div>

        ${systemCrossTlReqs.map(r => `<tr>
          <td>${r.request_id}</td>
          <td>${esc(r.agent_id)}</td>
          <td>${esc(r.agent_team_tl_id)}</td>
          <td><b style="color:var(--ok)">${esc(r.approved_by_tl_id)}</b></td>
          <td>${r.currency} ${fmt(r.amount)}</td>

  window.filterQaTable = () => {
    const curAgent = (window.memQaAgent || '').toLowerCase();
    const curTl = window.memQaTl || '';
    const curReason = window.memQaReason || '';

    document.querySelectorAll('.qa-queue-row').forEach(row => {
      const agent = (row.getAttribute('data-agent') || '').toLowerCase();
      const tl = row.getAttribute('data-tl') || '';
      const reason = row.getAttribute('data-reason') || '';

      const matchesAgent = curAgent === '' || agent.includes(curAgent);
      const matchesTl = curTl === '' || tl === curTl;
      const matchesReason = curReason === '' || reason === curReason;

      row.style.display = (matchesAgent && matchesTl && matchesReason) ? '' : 'none';
    });
  };

  window.exportHistoryToCSV = () => {
    if (qaReviews.length === 0) return alert('No history to export.');
    
    const headers = ['Request ID', 'QA Insight', 'QA Result', 'Severity', 'Check: Justification', 'Check: Policy', 'Check: PNR', 'Trainer Status', 'Trainer Notes', 'OAM Status', 'OAM Notes', 'Coaching Date', 'Coaching Type', 'TL Ack Status', 'Agent Ack Status'];
    const rows = qaReviews.map(q => [
      q.request_id, q.qa_insights, q.qa_result, q.severity,
      q.checked_justification ? 'Yes' : 'No',
      q.checked_policy ? 'Yes' : 'No',
      q.checked_pnr ? 'Yes' : 'No',
      q.trainer_status, q.trainer_notes || '', q.oam_status, q.oam_notes || '',
      q.coaching_date || '', q.coaching_type || '',
      q.tl_ack_status || 'pending', q.agent_ack_status || 'not_sent'
    ]);
    
    const csvContent = "data:text/csv;charset=utf-8," 
      + [headers, ...rows].map(e => e.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
      
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "qa_review_history.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  function viewAgentScorecards() {
    const agentStats = {};
    
    qaReviews.forEach(q => {
      const req = reqs.find(r => r.request_id === q.request_id);
      if (!req) return;
      
      const agId = req.agent_id;
      if (!agentStats[agId]) agentStats[agId] = { total: 0, pass: 0, fail: 0, agent_name: agId };
      agentStats[agId].total++;
      if (q.qa_result === 'pass') agentStats[agId].pass++;
      if (q.qa_result === 'fail') agentStats[agId].fail++;
    });

    const sortedAgents = Object.values(agentStats).sort((a, b) => b.fail - a.fail);

    return `
      <h2>Agent Scorecards</h2>
      <p class="mu">Identify agents who need coaching intervention based on QA Pass/Fail ratios.</p>
      
      <div class="tw"><table><thead><tr>
        <th>Agent ID</th><th>Total QA Reviews</th><th>Passes</th><th>Fails</th><th>Actionable Status</th>
      </tr></thead><tbody>
        ${sortedAgents.map(a => {
          const isFlagged = a.fail >= 3;
          return `<tr>
            <td><b>${esc(a.agent_name)}</b></td>
            <td>${a.total}</td>
            <td><span style="color:var(--ok)">${a.pass}</span></td>
            <td><span style="color:var(--ac)">${a.fail}</span></td>
            <td>${isFlagged ? '<span class="pill s-rejected" style="font-weight:bold;">🚩 Needs Coaching</span>' : '<span class="pill s-approved">On Track</span>'}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="5" class="mu">No QA reviews logged yet.</td></tr>'}
      </tbody></table></div>
    `;
  }

  function viewRoster() {
    return `
      <h2>Bulk Roster Upload</h2>
      <div class="card">
        <p class="mu" style="margin-top:0">Paste your CSV data below. Format: <code>BMS ID | Name | Email | PPR | Wave | TL ID</code></p>
        <textarea id="ru" placeholder="6332878 | Abrahams, Machandro | m.abrahams@delta.example | 2581441 | 26.21 | 5972127"></textarea>
        <p><button class="b" onclick="uploadRoster()">Upload Roster</button> <span id="rmsg" class="mu" style="margin-left:10px"></span></p>
      </div>`;
  }

  window.uploadRoster = async () => {
    $('#rmsg').textContent = 'Uploading…';
    $('#rmsg').style.color = 'var(--mu)';
    const lines = $('#ru').value.split('\n').map(s => s.trim()).filter(Boolean);
    let success = 0, failed = 0;
    
    for (const line of lines) {
      const parts = line.split('|').map(s => s.trim());
      if (parts.length < 6) { failed++; continue; }
      
      const [id, name, email, ppr, wave, tlid] = parts;
      const isNA = !tlid || tlid.toUpperCase() === 'NA';
      
      let oam_id = null, om_id = null;
      if (!isNA) {
        const { data: tl } = await sb.from('tls').select('oam_id, om_id').eq('tl_id', tlid).maybeSingle();
        if (tl) { oam_id = tl.oam_id; om_id = tl.om_id; }
      }
      
      const { error } = await sb.from('agents').upsert({
        agent_id: id, name: name, email: email, 
        ppr: ppr || null, wave: wave?.replace(/\s+/g,'') || null,
        tl_id: isNA ? null : tlid,
        oam_id: oam_id, om_id: om_id,
        reports_direct_to_oam: isNA, status: 'active'
      });
      
      if (error) { console.error(error); failed++; } else { success++; }
    }
    
    $('#rmsg').textContent = `Done! ${success} loaded, ${failed} failed.`;
    $('#rmsg').style.color = 'var(--ok)';
  };

  window.moveOam = async (oamId, newOmId) => {
    if (!newOmId) return;
    const { error } = await sb.from('oams').update({ om_id: newOmId }).eq('oam_id', oamId);
    if (error) return alert(error.message);

    await sb.from('tls').update({ om_id: newOmId }).eq('oam_id', oamId);
    await sb.from('agents').update({ om_id: newOmId }).eq('oam_id', oamId);

    const { data: oamData } = await sb.from('oams').select('*'); oams = oamData || [];
    alert('OAM moved successfully!');
    render();
  };

  window.moveTl = async (tlId, newOamId) => {
    if (!newOamId) return;
    const { data: oam } = await sb.from('oams').select('om_id').eq('oam_id', newOamId).single();
    if (!oam) return alert('Invalid OAM');
    
    await sb.from('tls').update({ oam_id: newOamId, om_id: oam.om_id }).eq('tl_id', tlId);
    await sb.from('agents').update({ oam_id: newOamId, om_id: oam.om_id }).eq('tl_id', tlId);
    
    const { data: tlData } = await sb.from('tls').select('*'); tls = tlData || [];
    alert('TL moved successfully!');
    render();
  };

  window.moveAgent = async (agentId, newTlId) => {
    if (!newTlId) return;
    const { data: tl } = await sb.from('tls').select('oam_id, om_id').eq('tl_id', newTlId).single();
    if (!tl) return alert('Invalid TL');
    
    await sb.from('agents').update({ tl_id: newTlId, oam_id: tl.oam_id, om_id: tl.om_id }).eq('agent_id', agentId);
    alert('Agent moved successfully!');
    render();
  };

  window.bulkReassign = async () => {
    const oldTlId = $('#bulkOldTl').value;
    const newTlId = $('#bulkNewTl').value;
    if (!oldTlId || !newTlId) return alert('Please select both TLs.');
    if (oldTlId === newTlId) return alert('Cannot move a team to the same TL.');
    
    const { data: newTl } = await sb.from('tls').select('oam_id, om_id').eq('tl_id', newTlId).single();
    if (!newTl) return alert('Invalid New TL');
    
    const { count, error } = await sb.from('agents')
      .update({ tl_id: newTlId, oam_id: newTl.oam_id, om_id: newTl.om_id }, { count: 'exact' })
      .eq('tl_id', oldTlId);
      
    if (error) {
      alert('Error: ' + error.message);
    } else {
      alert(`Success! ${count} agents moved to the new TL.`);
      const { data: agData } = await sb.from('agents').select('*'); allAgents = agData || [];
      render();
    }
  };

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  window.archiveData = async () => {
    if (!confirm("Are you sure? This will move all completed, rejected, and expired requests to the Archive table and remove them from the live queues. Agents, TLs, OAMs, and QA will still see them in their Archive tab.")) return;
    
    $('#archMsg').textContent = 'Archiving…';
    const { data, error } = await sb.rpc('archive_old_requests');
    
    if (error) {
      $('#archMsg').textContent = 'Error: ' + error.message;
      $('#archMsg').style.color = 'var(--ac)';
    } else {
      $('#archMsg').textContent = `Done! ${data.archived_count} requests moved to archive.`;
      $('#archMsg').style.color = 'var(--ok)';
      await refresh();
    }
  };

  window.archiveQAReviews = async () => {
    const daysInput = $('#archQaDays');
    const days = daysInput ? +daysInput.value : 90;
    if (!days || days < 1) return alert('Please enter a valid number of days (≥ 1).');

    if (!confirm(`Archive QA reviews that are FULLY CLOSED (Trainer AND OAM both marked actioned/coached) and older than ${days} days?\n\nPending reviews will stay in the queues.`)) return;

    $('#archQaMsg').textContent = 'Archiving…';
    $('#archQaMsg').style.color = 'var(--mu)';

    const { data, error } = await sb.rpc('archive_old_qa_reviews', { p_days: days });

    if (error) {
      $('#archQaMsg').textContent = 'Error: ' + error.message;
      $('#archQaMsg').style.color = 'var(--ac)';
    } else {
      $('#archQaMsg').textContent = `Done! ${data.archived_count} QA reviews moved to archive.`;
      $('#archQaMsg').style.color = 'var(--ok)';
      await refresh();
    }
  };
